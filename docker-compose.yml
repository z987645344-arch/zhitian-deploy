name: zhitian-mvp

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  zhitian-api:
    image: zhitian-api:dev-production
    build:
      context: ../zhitian
      dockerfile: Dockerfile
    env_file:
      - ../zhitian/.env
    environment:
      LIBREOFFICE_PATH: /usr/bin/soffice
      TMPDIR: /app/data/tmp_uploads
    expose:
      - "8000"
    volumes:
      - zhitian_data:/app/data
    tmpfs:
      - /app/data/tmp_uploads:size=268435456,mode=1777
    networks:
      - backend
    restart: unless-stopped
    stop_grace_period: 45s
    init: true
    mem_limit: 2g
    mem_reservation: 512m
    cpus: 2.0
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *default-logging

  zhitian-admin:
    image: zhitian-admin:dev-production
    build:
      context: ../zhitian_admin
      dockerfile: Dockerfile
    expose:
      - "8080"
    networks:
      - frontend
    restart: unless-stopped
    init: true
    mem_limit: 128m
    cpus: 0.5
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *default-logging
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --output-document=-
        - http://127.0.0.1:8080/login.html
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  zhitian-web:
    image: zhitian-web:dev-production
    build:
      context: ../zhitian/web_client
      dockerfile: Dockerfile
    expose:
      - "8080"
    networks:
      - frontend
    restart: unless-stopped
    init: true
    mem_limit: 128m
    cpus: 0.5
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *default-logging
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --output-document=-
        - http://127.0.0.1:8080/login.html
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  reverse-proxy:
    image: nginx:stable-alpine
    user: "101:101"
    depends_on:
      zhitian-api:
        condition: service_healthy
      zhitian-admin:
        condition: service_healthy
      zhitian-web:
        condition: service_healthy
    ports:
      - "${SERVER_PUBLIC_IP}:80:8080"
    volumes:
      - ./nginx/compose-nginx.conf:/etc/nginx/nginx.conf:ro
    tmpfs:
      - /tmp:size=16777216,mode=1777
    networks:
      - frontend
      - backend
    restart: unless-stopped
    init: true
    mem_limit: 128m
    cpus: 0.5
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *default-logging
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --output-document=-
        - http://127.0.0.1:8080/api/ready
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  frontend:
    driver: bridge
    internal: true
  backend:
    driver: bridge

volumes:
  zhitian_data:
    name: zhitian-mvp-data
